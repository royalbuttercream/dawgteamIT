<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Pre-paint theme: apply the stored choice before the first frame to avoid a flash. */
(function () {
  var c; try { c = localStorage.getItem('lambdaxi-theme') || 'system'; } catch (e) { c = 'system'; }
  var dark = c === 'dark' || (c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme-choice', c);
})();
</script>
