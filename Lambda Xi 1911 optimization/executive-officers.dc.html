<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  * { box-sizing: border-box; }
  @media (max-width: 900px) { .desktop-nav, .desktop-only { display: none !important; } }
  @media (min-width: 901px) { .mobile-only { display: none !important; } }
  .nav-item-wrap:hover .submenu { opacity: 1; visibility: visible; transform: translateY(0); }
</style>
</helmet>

<div style="font-family: 'Libre Franklin', sans-serif; background: oklch(0.985 0.004 90); color: oklch(0.22 0.02 300); min-height: 100vh;">

  <header style="position: sticky; top: 0; z-index: 50; background: oklch(0.2 0.06 300);">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 84px;">
      <a href="Lambda Xi Homepage.dc.html" style="display: flex; align-items: center; gap: 14px;">
        <img src="../images/shared/omega-psi-phi-crest.png" alt="Omega Psi Phi crest" style="width: 52px; height: 52px; object-fit: contain; flex-shrink: 0;" />
        <div style="display: flex; flex-direction: column; line-height: 1.15;">
          <span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 19px; color: white;">Lambda Xi Chapter</span>
          <span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.82 0.11 85);">The RoK Hard Ques &middot; Est. 1977</span>
        </div>
      </a>
      <nav style="display: flex; align-items: center; gap: 2px;" class="desktop-nav">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="7">
          <div style="position: relative;" class="nav-item-wrap">
            <a href="{{ item.href }}" style="display: flex; align-items: center; gap: 5px; padding: 10px 14px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.92); border-radius: 6px;" style-hover="background: rgba(255,255,255,0.1); color: white;">
              {{ item.label }}
              <sc-if value="{{ item.hasSub }}"><span style="font-size: 9px; opacity: 0.7;">&#9660;</span></sc-if>
            </a>
            <sc-if value="{{ item.hasSub }}">
              <div class="submenu" style="position: absolute; top: 100%; left: 0; min-width: 220px; background: oklch(0.24 0.05 300); border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.28); padding: 6px; opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity 0.15s, transform 0.15s;">
                <sc-for list="{{ item.submenu }}" as="sub" hint-placeholder-count="3">
                  <a href="{{ sub.href }}" style="display: block; padding: 10px 12px; font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,0.85); border-radius: 5px;" style-hover="background: oklch(0.3 0.07 300); color: white;">{{ sub.label }}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </nav>
      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="https://msp.oppf.org/" class="desktop-only" style="background: oklch(0.7 0.14 85); color: oklch(0.2 0.04 300); padding: 10px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 700;">Seeking</a>
        <button onClick="{{ toggleMobileMenu }}" class="mobile-only" style="background: none; border: none; color: white; font-size: 22px; padding: 6px; cursor: pointer;">{{ mobileMenuIcon }}</button>
      </div>
    </div>
    <sc-if value="{{ mobileMenuOpen }}" hint-placeholder-val="{{ false }}">
      <div class="mobile-only" style="background: oklch(0.2 0.045 300); padding: 8px 16px 20px;">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="7">
          <div>
            <a href="{{ item.href }}" style="display: block; padding: 12px 8px; font-size: 15px; font-weight: 600; color: white; border-bottom: 1px solid rgba(255,255,255,0.08);">{{ item.label }}</a>
            <sc-if value="{{ item.hasSub }}">
              <div style="padding-left: 16px;">
                <sc-for list="{{ item.submenu }}" as="sub" hint-placeholder-count="3">
                  <a href="{{ sub.href }}" style="display: block; padding: 9px 8px; font-size: 13.5px; color: rgba(255,255,255,0.75);">{{ sub.label }}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </header>

  <section style="padding: 64px 24px 24px; text-align: center; background: linear-gradient(160deg, oklch(0.24 0.06 300), oklch(0.16 0.05 300)); color: white;">
    <p style="font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase; color: oklch(0.82 0.11 85); font-weight: 700; margin: 0 0 12px;">Our Legacy</p>
    <h1 style="font-family: 'Playfair Display', serif; font-size: clamp(28px, 4vw, 42px); font-weight: 700; margin: 0;">Executive Officers</h1>
  </section>

  <section style="padding: 64px 24px 96px;">
    <div style="max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px;">
      <sc-for list="{{ officers }}" as="o" hint-placeholder-count="8">
        <div style="background: white; border: 1px solid oklch(0.9 0.01 90); border-radius: 14px; padding: 28px 20px; text-align: center;">
          <img src="{{ o.photo }}" alt="{{ o.name }}" style="width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px; display: block; background: oklch(0.92 0.01 90);" />
          <p style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: oklch(0.5 0.1 300); margin: 0 0 6px;">{{ o.title }}</p>
          <p style="font-size: 15.5px; font-weight: 700; margin: 0; color: oklch(0.22 0.05 300);">{{ o.name }}</p>
        </div>
      </sc-for>
    </div>
  </section>

  <footer style="background: oklch(0.14 0.04 300); color: rgba(255,255,255,0.6); padding: 32px 24px; text-align: center; font-size: 12.5px;">
    <p style="margin: 0 0 6px;">&copy; Lambda Xi Chapter, Omega Psi Phi Fraternity, Inc. &mdash; Established 1977</p>
    <a href="Lambda Xi Homepage.dc.html" style="color: oklch(0.75 0.12 85);">&larr; Back to Home</a>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mobileMenuOpen: false };
  renderVals() {
    const navItems = [
      { label: 'Home', href: 'Lambda Xi Homepage.dc.html', hasSub: false },
      { label: 'Our Legacy', href: 'history-of-omega-psi-phi.dc.html', hasSub: true, submenu: [
        { label: 'History of Omega Psi Phi', href: 'history-of-omega-psi-phi.dc.html' },
        { label: 'History of Lambda Xi', href: 'history-of-lambda-xi.dc.html' },
        { label: 'Executive Officers', href: 'executive-officers.dc.html' },
        { label: 'Past Basilei', href: 'past-basilei.dc.html' },
        { label: 'Lineage', href: 'lineage.dc.html' },
      ]},
      { label: 'Programs', href: 'mandated-programs.dc.html', hasSub: true, submenu: [
        { label: 'Mandated Programs', href: 'mandated-programs.dc.html' },
        { label: 'Scholarships', href: 'scholarships.dc.html' },
      ]},
      { label: 'Events', href: '50th-anniversary-gala.dc.html', hasSub: false },
      { label: 'Gallery', href: 'Lambda Xi Homepage.dc.html#gallery', hasSub: false },
      { label: 'News', href: 'news.dc.html', hasSub: false },
      { label: 'Contact', href: 'contact-us.dc.html', hasSub: false },
    ];
    const officers = [
      { title: 'Basileus', name: 'Brother Eugene Gibbs', photo: 'https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit,fl_lossy,h_9000,w_1200,f_auto,q_1/1312902/444093_62887.png' },
      { title: 'Immediate Past Basileus', name: 'Brother Richard Smith', photo: 'https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit,fl_lossy,h_9000,w_1200,f_auto,q_1/1312902/513090_102219.png' },
      { title: 'Vice Basileus', name: 'Brother Randy Artis', photo: 'https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit,fl_lossy,h_9000,w_1200,f_auto,q_1/1312902/379959_494615.png' },
      { title: 'Keeper of Records and Seal', name: 'Brother Charlesvester Wims', photo: 'https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit,fl_lossy,h_9000,w_1200,f_auto,q_1/1312902/778436_648335.png' },
      { title: 'Keeper of Finance', name: 'Brother Marcus Shepard', photo: 'https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit,fl_lossy,h_9000,w_1200,f_auto,q_1/1312902/51925_963828.png' },
      { title: 'Chaplain', name: 'Brother Andrew Wesley', photo: 'https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit,fl_lossy,h_9000,w_1200,f_auto,q_1/1312902/662587_76485.png' },
      { title: 'Keeper of Peace', name: 'Brother Clint Carmichael', photo: 'https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit,fl_lossy,h_9000,w_1200,f_auto,q_1/1312902/95980_181159.png' },
      { title: 'Editor to the Oracle', name: 'Brother Michael Robinson', photo: 'https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit,fl_lossy,h_9000,w_1200,f_auto,q_1/1312902/888283_599390.png' },
    ];
    return {
      navItems,
      officers,
      mobileMenuOpen: this.state.mobileMenuOpen,
      mobileMenuIcon: this.state.mobileMenuOpen ? '\u2715' : '\u2630',
      toggleMobileMenu: () => this.setState(s => ({ mobileMenuOpen: !s.mobileMenuOpen })),
    };
  }
}

</script>
</body>
</html>
